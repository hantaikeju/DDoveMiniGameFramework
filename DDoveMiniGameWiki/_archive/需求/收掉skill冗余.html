<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收掉skill冗余</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>收掉skill冗余（需求稿）</h1>
  <p class="sub">权威正文写入浅层副本 · help 只指向 · create 停下后等人发 work</p>
  <svg class="diag" viewBox="0 0 980 320" role="img" aria-label="纳入副本对齐、help 一处、create 停下；排除改 grill、work、with-demand、目录、评分和客户端">
    <rect x="24" y="24" width="200" height="176" rx="14" fill="#fffcf7" stroke="#e3dcd0"/>
    <text x="124" y="78" text-anchor="middle" font-size="14" font-weight="650">.agents</text>
    <text x="124" y="108" text-anchor="middle" font-size="13">权威 SKILL</text>
    <text x="124" y="140" text-anchor="middle" font-size="13" fill="#6f675e">create 末句停下</text>
    <path d="M224 112 H268" stroke="#b8ae9f" stroke-width="2"/>
    <rect x="268" y="24" width="250" height="176" rx="14" fill="#f1f6e8" stroke="#c9d6a8"/>
    <text x="393" y="70" text-anchor="middle" font-size="14" font-weight="650" fill="#3f6212">浅层 .cursor</text>
    <text x="393" y="100" text-anchor="middle" font-size="13">六份全文对齐</text>
    <text x="393" y="128" text-anchor="middle" font-size="13">嵌套副本同文</text>
    <text x="393" y="164" text-anchor="middle" font-size="13" fill="#6f675e">目录保留</text>
    <path d="M518 80 H562" stroke="#b8ae9f" stroke-width="2"/>
    <rect x="562" y="24" width="394" height="80" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
    <text x="759" y="72" text-anchor="middle" font-size="14" font-weight="650">help 步骤 3 → grill / work / 需求稿工作流</text>
    <path d="M518 144 H562" stroke="#b8ae9f" stroke-width="2"/>
    <rect x="562" y="120" width="394" height="80" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
    <text x="759" y="168" text-anchor="middle" font-size="14" font-weight="650">create 落稿后停下</text>
    <rect x="24" y="224" width="932" height="72" rx="12" fill="#f8efe8" stroke="#e4cfc0"/>
    <text x="490" y="266" text-anchor="middle" font-size="14" fill="#9a3412">界外：grill 第 5 步 · work 不数稿 · with-demand · 开工评分 · 客户端</text>
  </svg>
</main>
</body>
</html>
