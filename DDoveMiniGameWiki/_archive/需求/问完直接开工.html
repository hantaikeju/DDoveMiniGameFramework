<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>问完直接开工（需求稿）</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .zone { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
  .zone.in { border-color: #c9d6a8; }
  .zone.out { border-color: #e8c4b4; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--in-soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .zone.out .chip { background: var(--out-soft); text-decoration: line-through; text-decoration-color: #c2410c; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>问完直接开工（需求稿）</h1>
  <p class="sub">问完 · 同一条对话开工 · 补充另开 grill</p>
  <section class="band">
    <h2>问完之后</h2>
    <svg class="diag" viewBox="0 0 980 220" role="img" aria-label="选择题问完后直接开工，补充另开一次 grill">
      <rect x="24" y="70" width="160" height="64" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="104" y="96" text-anchor="middle" font-size="14" font-weight="650">AskQuestion</text>
      <text x="104" y="116" text-anchor="middle" font-size="12" fill="#6f675e">等人提交</text>
      <rect x="230" y="70" width="170" height="64" rx="12" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="315" y="96" text-anchor="middle" font-size="14" font-weight="650">frontier 空</text>
      <text x="315" y="116" text-anchor="middle" font-size="12" fill="#6f675e">复述后直接开工</text>
      <rect x="450" y="24" width="200" height="64" rx="12" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="550" y="50" text-anchor="middle" font-size="14" font-weight="650" fill="#3f6212">没有补充</text>
      <text x="550" y="70" text-anchor="middle" font-size="12" fill="#6f675e">落稿 + ddove-work</text>
      <rect x="450" y="124" width="200" height="64" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="550" y="150" text-anchor="middle" font-size="14" font-weight="650">有补充</text>
      <text x="550" y="170" text-anchor="middle" font-size="12" fill="#6f675e">另开 /ddove-grill</text>
      <rect x="710" y="24" width="230" height="64" rx="12" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="825" y="50" text-anchor="middle" font-size="14" font-weight="650" fill="#3f6212">三份 grill 同一说法</text>
      <text x="825" y="70" text-anchor="middle" font-size="12" fill="#6f675e">不等点头</text>
    </svg>
  </section>
  <section class="band">
    <h2>纳入 · 排除</h2>
    <div class="grid">
      <div class="zone in">
        <div class="chips">
          <span class="chip">问完进入 ddove-work</span>
          <span class="chip">补充下次再 grill</span>
          <span class="chip">AskQuestion 仍等人提交</span>
        </div>
      </div>
      <div class="zone out">
        <div class="chips">
          <span class="chip">回一句确认</span>
          <span class="chip">要不要补充</span>
          <span class="chip">拿掉 AskQuestion</span>
          <span class="chip">改开工评分</span>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
