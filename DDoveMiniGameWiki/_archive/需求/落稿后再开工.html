<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>落稿后再开工</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>落稿后再开工</h1>
  <p class="sub">问完先落需求稿 · 人另发 /ddove-work 再开工</p>
  <svg class="diag" viewBox="0 0 980 220" role="img" aria-label="grill 落稿后停下，人另发 work 才按这篇开工">
    <rect x="36" y="40" width="250" height="140" rx="14" fill="#f1f6e8" stroke="#c9d6a8"/>
    <text x="161" y="90" text-anchor="middle" font-size="15" font-weight="650" fill="#3f6212">/ddove-grill</text>
    <text x="161" y="122" text-anchor="middle" font-size="13">问完复述并落稿</text>
    <text x="161" y="148" text-anchor="middle" font-size="13" fill="#6f675e">然后停下</text>
    <path d="M286 110 H360" stroke="#b8ae9f" stroke-width="2"/>
    <rect x="360" y="40" width="250" height="140" rx="14" fill="#fffcf7" stroke="#e3dcd0"/>
    <text x="485" y="90" text-anchor="middle" font-size="15" font-weight="650">人</text>
    <text x="485" y="122" text-anchor="middle" font-size="13">另发 /ddove-work</text>
    <path d="M610 110 H684" stroke="#b8ae9f" stroke-width="2"/>
    <rect x="684" y="40" width="260" height="140" rx="14" fill="#e8eef5" stroke="#c9d6e6"/>
    <text x="814" y="90" text-anchor="middle" font-size="15" font-weight="650">ddove-work</text>
    <text x="814" y="122" text-anchor="middle" font-size="13">按刚落的这篇开工</text>
    <text x="814" y="148" text-anchor="middle" font-size="13" fill="#6f675e">不数其它稿</text>
  </svg>
</main>
</body>
</html>
