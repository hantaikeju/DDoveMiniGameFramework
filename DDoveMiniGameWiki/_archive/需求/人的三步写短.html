<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人的三步写短</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>人的三步写短（需求稿）</h1>
  <p class="sub">纳入两个链接加三句 · 排除改 skill、AGENTS 和其余章节</p>
  <svg class="diag" viewBox="0 0 980 260" role="img" aria-label="README 人的三步收成两个链接和三句，skill 与其余章节留在界外">
    <rect x="24" y="20" width="620" height="160" rx="14" fill="#f1f6e8" stroke="#c9d6a8"/>
    <text x="334" y="56" text-anchor="middle" font-size="15" font-weight="650" fill="#3f6212">README 人的三步</text>
    <text x="334" y="92" text-anchor="middle" font-size="14">需求稿工作流 · Agent 总览</text>
    <text x="334" y="124" text-anchor="middle" font-size="14">对齐停下 · 人另发 work · 看用法篇</text>
    <text x="334" y="152" text-anchor="middle" font-size="13" fill="#6f675e">各一句，细则不抄进这一节</text>
    <rect x="668" y="20" width="288" height="160" rx="14" fill="#f8efe8" stroke="#e4cfc0"/>
    <text x="812" y="64" text-anchor="middle" font-size="15" font-weight="650" fill="#9a3412">界外</text>
    <text x="812" y="100" text-anchor="middle" font-size="13">grill · work · with-demand</text>
    <text x="812" y="128" text-anchor="middle" font-size="13">AGENTS.md</text>
    <text x="812" y="156" text-anchor="middle" font-size="13">其它入口 · 目录 · 第三方</text>
    <rect x="24" y="200" width="932" height="40" rx="10" fill="#fffcf7" stroke="#e3dcd0"/>
    <text x="490" y="226" text-anchor="middle" font-size="13" fill="#6f675e">这一节不再写：不数稿 · 接上前文 · 产品不对 · 人不改状态 · /ddove-help</text>
  </svg>
</main>
</body>
</html>
