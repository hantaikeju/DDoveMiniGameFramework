<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页内 Tab 用 Toggle</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .node { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; }
  .node b { display: block; font-size: 13px; }
  .node span { display: block; color: var(--muted); font-size: 12px; }
  .node.call { background: var(--node-soft); border-color: #c9d6e6; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>页内 Tab 用 Toggle</h1>
  <p class="sub">用法 · 组约束与换页时机</p>

  <section class="band">
    <h2>职责</h2>
    <div class="flow">
      <div class="node"><b>WndTabDemo</b><span>ToggleGroup 根上</span></div>
      <div class="node"><b>BtnTabA / BtnTabB</b><span>isOn 1 或 0</span></div>
      <div class="node call"><b>TabOnOff.Refresh</b><span>外观不改 Image.color</span></div>
      <div class="node call"><b>OpenChildAsync</b><span>换页才调</span></div>
    </div>
  </section>

  <section class="band">
    <h2>谁调谁</h2>
    <svg class="diag" viewBox="0 0 980 220" role="img" aria-label="静默写 isOn 后 Refresh，换编号才 OpenChild">
      <rect x="30" y="70" width="200" height="80" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="130" y="104" text-anchor="middle" font-size="14" font-weight="650">SetIsOnWithoutNotify</text>
      <text x="130" y="126" text-anchor="middle" font-size="12" fill="#6f675e">A=1 · B=0 · 不去掉全部监听</text>
      <path d="M230 110 H290" stroke="#b8ae9f" stroke-width="2"/>
      <polygon points="290,106 300,110 290,114" fill="#b8ae9f"/>
      <rect x="300" y="70" width="180" height="80" rx="12" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="390" y="104" text-anchor="middle" font-size="14" font-weight="650">Refresh</text>
      <text x="390" y="126" text-anchor="middle" font-size="12" fill="#6f675e">On / Off 见显 On Off</text>
      <path d="M480 110 H540" stroke="#b8ae9f" stroke-width="2"/>
      <polygon points="540,106 550,110 540,114" fill="#b8ae9f"/>
      <rect x="550" y="30" width="190" height="70" rx="12" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="645" y="60" text-anchor="middle" font-size="13" font-weight="650">编号换了</text>
      <text x="645" y="80" text-anchor="middle" font-size="12" fill="#6f675e">OpenChildAsync · Content</text>
      <rect x="550" y="120" width="190" height="70" rx="12" fill="#f8ebe3" stroke="#e8c4b4"/>
      <text x="645" y="150" text-anchor="middle" font-size="13" font-weight="650" fill="#9a3412">已是这编号</text>
      <text x="645" y="170" text-anchor="middle" font-size="12" fill="#6f675e">返回 · 不再开</text>
      <rect x="770" y="70" width="180" height="80" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="860" y="104" text-anchor="middle" font-size="13" font-weight="650">A=1 · B=2</text>
      <text x="860" y="126" text-anchor="middle" font-size="12" fill="#6f675e">另一真则静默 false</text>
    </svg>
  </section>
</main>
</body>
</html>
