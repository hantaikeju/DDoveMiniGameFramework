<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMP 中文 Fallback</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .node { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; }
  .node b { display: block; font-size: 13px; }
  .node span { display: block; color: var(--muted); font-size: 12px; }
  .node.call { background: var(--node-soft); border-color: #c9d6e6; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>TMP 中文 Fallback</h1>
  <p class="sub">用法 · 缺汉字走 Noto 动态图集</p>

  <section class="band">
    <h2>职责</h2>
    <div class="flow">
      <div class="node"><b>NotoSerifCJKsc-Medium SDF</b><span>源 otf · 动态多页</span></div>
      <div class="node call"><b>LiberationSans Fallback</b><span>西文先 · Noto 后</span></div>
      <div class="node call"><b>TMP Settings Fallback</b><span>全局再查</span></div>
    </div>
  </section>

  <section class="band">
    <h2>谁调谁</h2>
    <svg class="diag" viewBox="0 0 980 200" role="img" aria-label="组件指定 LiberationSans 时缺字走 Fallback">
      <rect x="30" y="60" width="220" height="80" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="140" y="96" text-anchor="middle" font-size="14" font-weight="650">组件仍挂 LiberationSans</text>
      <text x="140" y="118" text-anchor="middle" font-size="12" fill="#6f675e">拉丁 + 少量标点</text>
      <path d="M250 100 H310" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="310" y="30" width="220" height="70" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="420" y="60" text-anchor="middle" font-size="13" font-weight="650">字体自己的 Fallback</text>
      <text x="420" y="80" text-anchor="middle" font-size="12" fill="#6f675e">西文条 + Noto</text>
      <rect x="310" y="120" width="220" height="70" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="420" y="150" text-anchor="middle" font-size="13" font-weight="650">TMP Settings 全局表</text>
      <text x="420" y="170" text-anchor="middle" font-size="12" fill="#6f675e">自己表没有再查</text>
      <rect x="570" y="60" width="200" height="80" rx="12" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="670" y="96" text-anchor="middle" font-size="13" font-weight="650">Noto 动态图集</text>
      <text x="670" y="118" text-anchor="middle" font-size="12" fill="#6f675e">用到的字写入 · 满页再开</text>
      <rect x="800" y="60" width="150" height="80" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="875" y="96" text-anchor="middle" font-size="12" font-weight="650">默认字体见</text>
      <text x="875" y="118" text-anchor="middle" font-size="12" fill="#6f675e">TMP默认字体用Noto</text>
    </svg>
  </section>
</main>
</body>
</html>
