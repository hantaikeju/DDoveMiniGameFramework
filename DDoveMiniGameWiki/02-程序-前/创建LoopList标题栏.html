<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创建 LoopList 标题栏</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .node { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; }
  .node b { display: block; font-size: 13px; }
  .node span { display: block; color: var(--muted); font-size: 12px; }
  .node.call { background: var(--node-soft); border-color: #c9d6e6; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>创建 LoopList 标题栏</h1>
  <p class="sub">用法 · GetWindow 留一扇</p>

  <section class="band">
    <h2>职责</h2>
    <div class="flow">
      <div class="node call"><b>CreateLoopListWindow.Open</b><span>写标题 · 锁尺寸 · 居中</span></div>
      <div class="node call"><b>GetWindow</b><span>只留一扇</span></div>
      <div class="node call"><b>DDoveEditorUi.Centered</b><span>420×268</span></div>
      <div class="node call"><b>ApplySheet</b><span>CreateGUI 套深色</span></div>
    </div>
  </section>

  <section class="band">
    <h2>谁调谁</h2>
    <svg class="diag" viewBox="0 0 980 200" role="img" aria-label="Open 不走 ShowUtility，创建 UI 场景仍 ShowUtility">
      <rect x="30" y="60" width="200" height="80" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="130" y="96" text-anchor="middle" font-size="14" font-weight="650">Open</text>
      <text x="130" y="118" text-anchor="middle" font-size="12" fill="#6f675e">不调用 ShowUtility</text>
      <path d="M230 100 H290" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="290" y="60" width="220" height="80" rx="12" fill="#1e3a5f"/>
      <text x="400" y="96" text-anchor="middle" font-size="14" fill="#f3efe6" font-weight="650">GetWindow</text>
      <text x="400" y="118" text-anchor="middle" font-size="12" fill="#c9d6e6">再开则聚焦</text>
      <path d="M510 100 H570" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="570" y="60" width="180" height="80" rx="12" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="660" y="96" text-anchor="middle" font-size="13" font-weight="650">Centered + ApplySheet</text>
      <text x="660" y="118" text-anchor="middle" font-size="12" fill="#6f675e">与 DDove/Editor 同类</text>
      <rect x="780" y="60" width="170" height="80" rx="12" fill="#f8ebe3" stroke="#e8c4b4"/>
      <text x="865" y="96" text-anchor="middle" font-size="13" font-weight="650" fill="#9a3412">创建 UI 场景</text>
      <text x="865" y="118" text-anchor="middle" font-size="12" fill="#6f675e">仍 ShowUtility</text>
    </svg>
  </section>
</main>
</body>
</html>
