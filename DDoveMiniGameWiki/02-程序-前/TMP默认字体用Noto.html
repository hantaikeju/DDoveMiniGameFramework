<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMP 默认字体用 Noto</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .node { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; }
  .node b { display: block; font-size: 13px; }
  .node span { display: block; color: var(--muted); font-size: 12px; }
  .node.call { background: var(--node-soft); border-color: #c9d6e6; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>TMP 默认字体用 Noto</h1>
  <p class="sub">用法 · 新建走默认 · 已有 Start 已改挂</p>

  <section class="band">
    <h2>职责</h2>
    <div class="flow">
      <div class="node"><b>NotoSerifCJKsc-Medium SDF</b><span>动态图集 · Atlas Material</span></div>
      <div class="node call"><b>TMP Settings 默认字体</b><span>新建文本走它</span></div>
      <div class="node call"><b>已有文本</b><span>Start Prefab / 场景</span></div>
      <div class="node call"><b>两处 Fallback</b><span>仍留 Noto</span></div>
    </div>
  </section>

  <section class="band">
    <h2>谁调谁</h2>
    <svg class="diag" viewBox="0 0 980 210" role="img" aria-label="默认字体、已有文本、Fallback 三条线">
      <rect x="24" y="60" width="200" height="90" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="124" y="96" text-anchor="middle" font-size="14" font-weight="650">Noto SDF</text>
      <text x="124" y="118" text-anchor="middle" font-size="12" fill="#6f675e">guid 5542ae72…</text>
      <path d="M224 80 H280" stroke="#b8ae9f" stroke-width="2"/>
      <path d="M224 115 H280" stroke="#b8ae9f" stroke-width="2"/>
      <path d="M224 145 H280" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="280" y="20" width="220" height="50" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="390" y="50" text-anchor="middle" font-size="12">默认字体 → 新建文本</text>
      <rect x="280" y="84" width="220" height="50" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="390" y="114" text-anchor="middle" font-size="12">已有文本 → 同份材质</text>
      <rect x="280" y="148" width="220" height="50" rx="10" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="390" y="178" text-anchor="middle" font-size="12">仍指定 LiberationSans → Fallback</text>
      <rect x="540" y="60" width="200" height="90" rx="12" fill="#f8ebe3" stroke="#e8c4b4"/>
      <text x="640" y="96" text-anchor="middle" font-size="13" font-weight="650" fill="#9a3412">不再引用</text>
      <text x="640" y="118" text-anchor="middle" font-size="12" fill="#6f675e">8f586378… LiberationSans</text>
      <rect x="770" y="60" width="186" height="90" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="863" y="96" text-anchor="middle" font-size="13" font-weight="650">汉字写进自己图集</text>
      <text x="863" y="118" text-anchor="middle" font-size="12" fill="#6f675e">满页再开下一页</text>
    </svg>
  </section>
</main>
</body>
</html>
