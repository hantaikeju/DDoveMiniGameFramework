<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页内 Tab 子页</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .node { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; }
  .node b { display: block; font-size: 13px; }
  .node span { display: block; color: var(--muted); font-size: 12px; }
  .node.call { background: var(--node-soft); border-color: #c9d6e6; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>页内 Tab 子页</h1>
  <p class="sub">用法 · Kit 开子页的挂点与生命周期</p>

  <section class="band">
    <h2>职责</h2>
    <div class="flow">
      <div class="node call"><b>OpenChildAsync</b><span>parent + Content</span></div>
      <div class="node call"><b>Close / CloseAll / BackAsync</b><span>先 Release 子页</span></div>
      <div class="node call"><b>NavigateToAsync</b><span>只 Hide 栈顶</span></div>
    </div>
  </section>

  <section class="band">
    <h2>谁调谁</h2>
    <svg class="diag" viewBox="0 0 980 240" role="img" aria-label="OpenChild 失败原因与关闭顺序">
      <rect x="24" y="70" width="220" height="100" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="134" y="110" text-anchor="middle" font-size="14" font-weight="650">OpenChildAsync</text>
      <text x="134" y="132" text-anchor="middle" font-size="12" fill="#6f675e">parent.GetType().Name</text>
      <path d="M244 120 H300" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="300" y="20" width="200" height="56" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="400" y="54" text-anchor="middle" font-size="12">已是这父的子 → Show</text>
      <rect x="300" y="88" width="200" height="56" rx="10" fill="#f8ebe3" stroke="#e8c4b4"/>
      <text x="400" y="122" text-anchor="middle" font-size="12" fill="#9a3412">already open / missing</text>
      <rect x="300" y="156" width="200" height="56" rx="10" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="400" y="190" text-anchor="middle" font-size="12">缓存有则挂回 Content</text>
      <rect x="540" y="30" width="200" height="80" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="640" y="62" text-anchor="middle" font-size="13" font-weight="650">关父页</text>
      <text x="640" y="84" text-anchor="middle" font-size="12" fill="#6f675e">EnableClose 先 Release</text>
      <rect x="540" y="130" width="200" height="80" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="640" y="162" text-anchor="middle" font-size="13" font-weight="650">NavigateToAsync</text>
      <text x="640" y="184" text-anchor="middle" font-size="12" fill="#6f675e">子页仍在 Content</text>
      <rect x="770" y="70" width="186" height="100" rx="12" fill="#f8ebe3" stroke="#e8c4b4"/>
      <text x="863" y="110" text-anchor="middle" font-size="13" font-weight="650" fill="#9a3412">TryCachePanel</text>
      <text x="863" y="132" text-anchor="middle" font-size="12" fill="#6f675e">有子页的父页不进 LRU</text>
    </svg>
  </section>
</main>
</body>
</html>
