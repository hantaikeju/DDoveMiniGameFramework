<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unity CLI Pipeline 接入</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; --warn:#9a3412; --warn-soft:#f8ebe3; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .node { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; }
  .node b { display: block; font-size: 13px; }
  .node span { display: block; color: var(--muted); font-size: 12px; }
  .node.call { background: var(--node-soft); border-color: #c9d6e6; }
  .node.warn { background: var(--warn-soft); border-color: #e8c4b4; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>Unity CLI Pipeline 接入</h1>
  <p class="sub">用法 · 团结编辑器、嵌入包、CLI、模态警告</p>

  <section class="band">
    <h2>职责</h2>
    <div class="flow">
      <div class="node"><b>团结 2022.3.61t14</b><span>Tuanjie 1.6.13 · Hub 打开</span></div>
      <div class="node"><b>com.unity.pipeline@0.4.0-exp.1</b><span>包内 unity 2022.3 · 不写 manifest</span></div>
      <div class="node call"><b>unity CLI 1.0.0-beta.2</b><span>editor_status · 7800–7849</span></div>
      <div class="node call"><b>硬边界</b><span>资源走 Pipeline · .cs 再重编译</span></div>
      <div class="node warn"><b>无 -automated</b><span>警告一次 · 不关弹窗</span></div>
    </div>
  </section>

  <section class="band">
    <h2>谁调谁</h2>
    <svg class="diag" viewBox="0 0 980 280" role="img" aria-label="Hub 打开团结编辑器，嵌入包起服务，无 automated 只打警告，CLI 与模态框分路">
      <rect x="16" y="24" width="168" height="72" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="100" y="52" text-anchor="middle" font-size="13" font-weight="650">Hub</text>
      <text x="100" y="74" text-anchor="middle" font-size="12" fill="#6f675e">无 -automated</text>
      <path d="M184 60 H220" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="220" y="24" width="200" height="72" rx="12" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="320" y="52" text-anchor="middle" font-size="13" font-weight="650">团结 2022.3.61t14</text>
      <text x="320" y="74" text-anchor="middle" font-size="12" fill="#6f675e">包声明 unity 2022.3</text>
      <path d="M420 60 H456" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="456" y="24" width="200" height="72" rx="12" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="556" y="52" text-anchor="middle" font-size="13" font-weight="650">Pipeline 服务</text>
      <text x="556" y="74" text-anchor="middle" font-size="12" fill="#6f675e">127.0.0.1:7800–7849</text>
      <path d="M556 96 V128" stroke="#b8ae9f" stroke-width="2"/>
      <path d="M556 128 H250" stroke="#b8ae9f" stroke-width="2"/>
      <path d="M250 128 V148" stroke="#b8ae9f" stroke-width="2"/>
      <path d="M556 128 H760" stroke="#b8ae9f" stroke-width="2"/>
      <path d="M760 128 V148" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="40" y="148" width="420" height="108" rx="12" fill="#f8ebe3" stroke="#e8c4b4"/>
      <text x="250" y="180" text-anchor="middle" font-size="13" font-weight="650" fill="#9a3412">ServerStarted 警告</text>
      <text x="250" y="204" text-anchor="middle" font-size="12" fill="#6f675e">模态框可能卡住连续命令</text>
      <text x="250" y="226" text-anchor="middle" font-size="12" fill="#6f675e">参数只消这行 · 交互式不必改启动</text>
      <rect x="520" y="148" width="440" height="108" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="740" y="180" text-anchor="middle" font-size="13" font-weight="650">CLI 连续命令</text>
      <text x="740" y="204" text-anchor="middle" font-size="12" fill="#6f675e">editor_status · set_autotick → recompile</text>
      <text x="740" y="226" text-anchor="middle" font-size="12" fill="#6f675e">弹窗未点掉则停在这一步</text>
    </svg>
  </section>
</main>
</body>
</html>
