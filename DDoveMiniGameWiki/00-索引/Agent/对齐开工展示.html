<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对齐开工展示</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>对齐开工展示</h1>
  <p class="sub">对齐落稿后停下 · 人发 work · 再展示</p>
  <svg class="diag" viewBox="0 0 980 160" role="img" aria-label="三步：grill 落稿停下，人发 work，展示">
    <rect x="40" y="30" width="260" height="100" rx="14" fill="#f1f6e8" stroke="#c9d6a8"/>
    <text x="170" y="74" text-anchor="middle" font-size="15" font-weight="650" fill="#3f6212">对齐</text>
    <text x="170" y="100" text-anchor="middle" font-size="13">落稿后停下</text>
    <path d="M300 80 H360" stroke="#b8ae9f" stroke-width="2"/>
    <rect x="360" y="30" width="260" height="100" rx="14" fill="#e8eef5" stroke="#c9d6e6"/>
    <text x="490" y="74" text-anchor="middle" font-size="15" font-weight="650">开工</text>
    <text x="490" y="100" text-anchor="middle" font-size="13">人发 /ddove-work</text>
    <path d="M620 80 H680" stroke="#b8ae9f" stroke-width="2"/>
    <rect x="680" y="30" width="260" height="100" rx="14" fill="#fffcf7" stroke="#e3dcd0"/>
    <text x="810" y="88" text-anchor="middle" font-size="15" font-weight="650">展示</text>
  </svg>
</main>
</body>
</html>
