<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一拍只处理一篇</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>一拍只处理一篇</h1>
  <p class="sub">grill 落稿后停下 · work 只做刚落的一篇 · with-demand 仍问完开工</p>
  <svg class="diag" viewBox="0 0 980 200" role="img" aria-label="grill 落稿即停；work 按一篇；with-demand 问完开工">
    <rect x="24" y="24" width="300" height="152" rx="14" fill="#f1f6e8" stroke="#c9d6a8"/>
    <text x="174" y="70" text-anchor="middle" font-size="15" font-weight="650" fill="#3f6212">/ddove-grill</text>
    <text x="174" y="100" text-anchor="middle" font-size="13">落稿后停下</text>
    <text x="174" y="128" text-anchor="middle" font-size="13" fill="#6f675e">等 /ddove-work</text>
    <rect x="340" y="24" width="300" height="152" rx="14" fill="#e8eef5" stroke="#c9d6e6"/>
    <text x="490" y="70" text-anchor="middle" font-size="15" font-weight="650">/ddove-work</text>
    <text x="490" y="100" text-anchor="middle" font-size="13">只做刚落的那一篇</text>
    <text x="490" y="128" text-anchor="middle" font-size="13" fill="#6f675e">不数其它稿</text>
    <rect x="656" y="24" width="300" height="152" rx="14" fill="#fffcf7" stroke="#e3dcd0"/>
    <text x="806" y="70" text-anchor="middle" font-size="14" font-weight="650">with-demand</text>
    <text x="806" y="100" text-anchor="middle" font-size="13">问完按已有这篇开工</text>
    <text x="806" y="128" text-anchor="middle" font-size="13" fill="#6f675e">不另建第二份</text>
  </svg>
</main>
</body>
</html>
