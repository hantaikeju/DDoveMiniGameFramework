<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>目标明确不数稿</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>目标明确不数稿</h1>
  <p class="sub">新目标不数稿 · 问完落稿后停下 · 已有稿走 with-demand</p>
  <svg class="diag" viewBox="0 0 980 180" role="img" aria-label="grill 不数稿并落稿停下；with-demand 问完开工">
    <rect x="36" y="28" width="440" height="124" rx="14" fill="#f1f6e8" stroke="#c9d6a8"/>
    <text x="256" y="72" text-anchor="middle" font-size="15" font-weight="650" fill="#3f6212">/ddove-grill</text>
    <text x="256" y="100" text-anchor="middle" font-size="13">不数稿 · 问完落稿后停下</text>
    <text x="256" y="126" text-anchor="middle" font-size="13" fill="#6f675e">开工等 /ddove-work</text>
    <rect x="504" y="28" width="440" height="124" rx="14" fill="#e8eef5" stroke="#c9d6e6"/>
    <text x="724" y="72" text-anchor="middle" font-size="15" font-weight="650">/ddove-grill-with-demand</text>
    <text x="724" y="104" text-anchor="middle" font-size="13">已有稿 · 问完按这篇开工</text>
  </svg>
</main>
</body>
</html>
