<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接上前文</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>接上前文</h1>
  <p class="sub">只敲命令接上最近一条 · 问完落稿后停下</p>
  <svg class="diag" viewBox="0 0 980 180" role="img" aria-label="只有命令接上前文，落稿后等 work">
    <rect x="30" y="30" width="300" height="120" rx="14" fill="#f1f6e8" stroke="#c9d6a8"/>
    <text x="180" y="72" text-anchor="middle" font-size="15" font-weight="650" fill="#3f6212">/ddove-grill</text>
    <text x="180" y="100" text-anchor="middle" font-size="13">只有命令 → 接上最近一条</text>
    <text x="180" y="124" text-anchor="middle" font-size="13" fill="#6f675e">问完落稿，然后停下</text>
    <path d="M330 90 H410" stroke="#b8ae9f" stroke-width="2"/>
    <rect x="410" y="30" width="240" height="120" rx="14" fill="#fffcf7" stroke="#e3dcd0"/>
    <text x="530" y="96" text-anchor="middle" font-size="14" font-weight="650">人 · /ddove-work</text>
    <path d="M650 90 H720" stroke="#b8ae9f" stroke-width="2"/>
    <rect x="720" y="30" width="230" height="120" rx="14" fill="#e8eef5" stroke="#c9d6e6"/>
    <text x="835" y="88" text-anchor="middle" font-size="14" font-weight="650">ddove-work</text>
    <text x="835" y="114" text-anchor="middle" font-size="13" fill="#6f675e">只做刚落的那一篇</text>
  </svg>
</main>
</body>
</html>
