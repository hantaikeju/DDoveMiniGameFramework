<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对齐后接着做完</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>对齐后接着做完</h1>
  <p class="sub">落稿后停下 · work 里改文件并写上状态</p>
  <svg class="diag" viewBox="0 0 980 160" role="img" aria-label="grill 只落稿，work 改文件并写状态">
    <rect x="40" y="30" width="280" height="100" rx="14" fill="#f1f6e8" stroke="#c9d6a8"/>
    <text x="180" y="74" text-anchor="middle" font-size="15" font-weight="650" fill="#3f6212">grill 落稿</text>
    <text x="180" y="100" text-anchor="middle" font-size="13">然后停下</text>
    <path d="M320 80 H400" stroke="#b8ae9f" stroke-width="2"/>
    <rect x="400" y="30" width="250" height="100" rx="14" fill="#fffcf7" stroke="#e3dcd0"/>
    <text x="525" y="88" text-anchor="middle" font-size="14" font-weight="650">人 · /ddove-work</text>
    <path d="M650 80 H720" stroke="#b8ae9f" stroke-width="2"/>
    <rect x="720" y="30" width="220" height="100" rx="14" fill="#e8eef5" stroke="#c9d6e6"/>
    <text x="830" y="74" text-anchor="middle" font-size="14" font-weight="650">改文件</text>
    <text x="830" y="100" text-anchor="middle" font-size="13">写上正式 / 废弃</text>
  </svg>
</main>
</body>
</html>
