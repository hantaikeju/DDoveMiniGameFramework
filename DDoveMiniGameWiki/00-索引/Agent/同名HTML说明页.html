<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>同名HTML说明页</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .node { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; }
  .node b { display: block; font-size: 13px; }
  .node span { display: block; color: var(--muted); font-size: 12px; }
  .node.call { background: var(--node-soft); border-color: #c9d6e6; }
  .arrow { color: var(--line); font-size: 20px; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { background: var(--out-soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; text-decoration: line-through; text-decoration-color: #c2410c; }
</style>
</head>
<body>
<main>
  <h1>同名HTML说明页</h1>
  <p class="sub">用法 · 旧两种种类的调用图 · 不改写成新用法</p>

  <section class="band">
    <h2>职责</h2>
    <div class="flow">
      <div class="node"><b>ddove-show-me</b><span>同目录同主文件名 HTML</span></div>
      <span class="arrow">←</span>
      <div class="node call"><b>/ddove-wiki-create</b><span>种类「要什么不要」</span></div>
      <span class="arrow">←</span>
      <div class="node call"><b>/ddove-wiki-change-state</b><span>先「三块」再「要什么不要」</span></div>
    </div>
  </section>

  <section class="band">
    <h2>谁调谁</h2>
    <svg class="diag" viewBox="0 0 980 260" role="img" aria-label="create 画要什么不要，change-state 画三块并重画需求稿">
      <rect x="30" y="30" width="200" height="70" rx="10" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="130" y="60" text-anchor="middle" font-size="14" font-weight="650">/ddove-wiki-create</text>
      <text x="130" y="80" text-anchor="middle" font-size="12" fill="#6f675e">落 05-需求</text>
      <rect x="30" y="140" width="200" height="90" rx="10" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="130" y="176" text-anchor="middle" font-size="14" font-weight="650">/ddove-wiki-change-state</text>
      <text x="130" y="198" text-anchor="middle" font-size="12" fill="#6f675e">05-需求 整份做完</text>
      <path d="M230 65 H310" stroke="#b8ae9f" stroke-width="2"/>
      <path d="M230 185 H310" stroke="#b8ae9f" stroke-width="2"/>
      <polygon points="310,61 320,65 310,69" fill="#b8ae9f"/>
      <polygon points="310,181 320,185 310,189" fill="#b8ae9f"/>
      <rect x="330" y="80" width="240" height="100" rx="12" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="450" y="124" text-anchor="middle" font-size="16" font-weight="650">ddove-show-me</text>
      <text x="450" y="146" text-anchor="middle" font-size="12" fill="#6f675e">一次一张 · 不改目标 .md</text>
      <path d="M570 100 H650" stroke="#b8ae9f" stroke-width="2"/>
      <path d="M570 160 H650" stroke="#b8ae9f" stroke-width="2"/>
      <polygon points="650,96 660,100 650,104" fill="#b8ae9f"/>
      <polygon points="650,156 660,160 650,164" fill="#b8ae9f"/>
      <rect x="670" y="36" width="280" height="80" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="810" y="70" text-anchor="middle" font-size="14" font-weight="650" fill="#3f6212">要什么不要</text>
      <text x="810" y="92" text-anchor="middle" font-size="12" fill="#6f675e">左纳入 · 右排除 · 窄屏上下</text>
      <rect x="670" y="140" width="280" height="80" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="810" y="174" text-anchor="middle" font-size="14" font-weight="650" fill="#3f6212">三块</text>
      <text x="810" y="196" text-anchor="middle" font-size="12" fill="#6f675e">干什么 · 有哪些接口 · 每个接口</text>
    </svg>
    <div class="chips">
      <span class="chip">ddove-work 过线</span>
      <span class="chip">改本机 /show-me</span>
      <span class="chip">已有篇补 HTML</span>
      <span class="chip">frontmatter / 脚本 / 分步按钮</span>
    </div>
  </section>
</main>
</body>
</html>
