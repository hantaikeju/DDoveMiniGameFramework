<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>说明页按show-me画</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .node { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; }
  .node b { display: block; font-size: 13px; }
  .node span { display: block; color: var(--muted); font-size: 12px; }
  .node.call { background: var(--node-soft); border-color: #c9d6e6; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>说明页按show-me画</h1>
  <p class="sub">用法 · 一种「说明页」· 开篇「打开说明」</p>

  <section class="band">
    <h2>职责</h2>
    <div class="flow">
      <div class="node call"><b>/ddove-wiki-create</b><span>落 05-需求</span></div>
      <div class="node call"><b>/ddove-wiki-change-state</b><span>用法篇 + 需求稿</span></div>
      <div class="node call"><b>/ddove-wiki-update</b><span>已有 HTML 才重画</span></div>
      <div class="node"><b>ddove-show-me</b><span>种类只剩「说明页」</span></div>
    </div>
  </section>

  <section class="band">
    <h2>谁调谁</h2>
    <svg class="diag" viewBox="0 0 980 240" role="img" aria-label="三个调用方都传入说明页，按篇类型取块画结构">
      <rect x="24" y="28" width="200" height="56" rx="10" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="124" y="62" text-anchor="middle" font-size="13" font-weight="650">三个调用方</text>
      <path d="M224 56 H300" stroke="#b8ae9f" stroke-width="2"/>
      <polygon points="300,52 310,56 300,60" fill="#b8ae9f"/>
      <rect x="310" y="20" width="220" height="72" rx="12" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="420" y="50" text-anchor="middle" font-size="14" font-weight="650">ddove-show-me</text>
      <text x="420" y="72" text-anchor="middle" font-size="12" fill="#6f675e">只认「说明页」</text>
      <path d="M420 92 V120" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="24" y="128" width="280" height="88" rx="12" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="164" y="162" text-anchor="middle" font-size="13" font-weight="650" fill="#3f6212">需求稿</text>
      <text x="164" y="186" text-anchor="middle" font-size="12" fill="#6f675e">05-需求 或 title 含需求稿</text>
      <text x="164" y="206" text-anchor="middle" font-size="12" fill="#6f675e">要什么 / 不要 → 纳入排除</text>
      <rect x="350" y="128" width="280" height="88" rx="12" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="490" y="162" text-anchor="middle" font-size="13" font-weight="650" fill="#3f6212">用法篇</text>
      <text x="490" y="186" text-anchor="middle" font-size="12" fill="#6f675e">干什么 / 接口三节</text>
      <text x="490" y="206" text-anchor="middle" font-size="12" fill="#6f675e">职责 / 谁调谁</text>
      <rect x="676" y="128" width="280" height="88" rx="12" fill="#f8ebe3" stroke="#e8c4b4"/>
      <text x="816" y="162" text-anchor="middle" font-size="13" font-weight="650" fill="#9a3412">不画</text>
      <text x="816" y="186" text-anchor="middle" font-size="12" fill="#6f675e">work 过线 · 无同名 HTML</text>
      <text x="816" y="206" text-anchor="middle" font-size="12" fill="#6f675e">本机 /show-me · 查看指令</text>
    </svg>
  </section>
</main>
</body>
</html>
