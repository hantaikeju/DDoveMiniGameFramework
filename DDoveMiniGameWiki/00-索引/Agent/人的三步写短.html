<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人的三步写短</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>人的三步写短</h1>
  <p class="sub">人读 README 这一节 · 细则去需求稿工作流 · 地图去 Agent 总览</p>
  <svg class="diag" viewBox="0 0 980 240" role="img" aria-label="人读 README 人的三步，链接到需求稿工作流和 Agent 总览">
    <rect x="24" y="40" width="200" height="160" rx="14" fill="#fffcf7" stroke="#e3dcd0"/>
    <text x="124" y="118" text-anchor="middle" font-size="15" font-weight="650">人</text>
    <path d="M224 120 H268" stroke="#b8ae9f" stroke-width="2"/>
    <rect x="268" y="24" width="280" height="192" rx="14" fill="#f1f6e8" stroke="#c9d6a8"/>
    <text x="408" y="64" text-anchor="middle" font-size="15" font-weight="650" fill="#3f6212">README 人的三步</text>
    <text x="408" y="100" text-anchor="middle" font-size="13">对齐 · grill 落稿后停下</text>
    <text x="408" y="128" text-anchor="middle" font-size="13">开工 · 人另发 work</text>
    <text x="408" y="156" text-anchor="middle" font-size="13">展示 · 用法篇与说明页</text>
    <text x="408" y="188" text-anchor="middle" font-size="13" fill="#6f675e">各一句</text>
    <path d="M548 80 H592" stroke="#b8ae9f" stroke-width="2"/>
    <path d="M548 160 H592" stroke="#b8ae9f" stroke-width="2"/>
    <rect x="592" y="36" width="360" height="72" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
    <text x="772" y="78" text-anchor="middle" font-size="14" font-weight="650">需求稿工作流 · 细则</text>
    <rect x="592" y="128" width="360" height="72" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
    <text x="772" y="170" text-anchor="middle" font-size="14" font-weight="650">Agent 总览 · 地图</text>
  </svg>
</main>
</body>
</html>
