<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收掉skill冗余</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>收掉skill冗余</h1>
  <p class="sub">浅层副本对齐权威 · help 只留一处 · create 落稿后停下</p>
  <svg class="diag" viewBox="0 0 980 280" role="img" aria-label="权威正文同步浅层副本，help 只在步骤 3 指路，create 落稿后停下">
    <rect x="36" y="24" width="280" height="232" rx="14" fill="#fffcf7" stroke="#e3dcd0"/>
    <text x="176" y="58" text-anchor="middle" font-size="15" font-weight="650">.agents/skills</text>
    <text x="176" y="88" text-anchor="middle" font-size="13" fill="#6f675e">权威正文</text>
    <text x="176" y="128" text-anchor="middle" font-size="13">wiki-create</text>
    <text x="176" y="152" text-anchor="middle" font-size="13">change-state · wiki</text>
    <text x="176" y="176" text-anchor="middle" font-size="13">wiki-update · fix-up</text>
    <text x="176" y="200" text-anchor="middle" font-size="13">writing-for-agents</text>
    <text x="176" y="228" text-anchor="middle" font-size="13" fill="#6f675e">help 步骤 3</text>
    <path d="M316 140 H390" stroke="#b8ae9f" stroke-width="2"/>
    <rect x="390" y="24" width="270" height="232" rx="14" fill="#f1f6e8" stroke="#c9d6a8"/>
    <text x="525" y="58" text-anchor="middle" font-size="15" font-weight="650" fill="#3f6212">浅层 .cursor/skills</text>
    <text x="525" y="88" text-anchor="middle" font-size="13">全文与权威一致</text>
    <text x="525" y="128" text-anchor="middle" font-size="13">嵌套副本同文</text>
    <text x="525" y="168" text-anchor="middle" font-size="13">help 整图 / 选路只指向</text>
    <text x="525" y="208" text-anchor="middle" font-size="13">create 落稿后停下</text>
    <text x="525" y="232" text-anchor="middle" font-size="13" fill="#6f675e">下一刀 /ddove-work</text>
    <path d="M660 140 H734" stroke="#b8ae9f" stroke-width="2"/>
    <rect x="734" y="70" width="210" height="140" rx="14" fill="#e8eef5" stroke="#c9d6e6"/>
    <text x="839" y="118" text-anchor="middle" font-size="14" font-weight="650">ddove-grill</text>
    <text x="839" y="148" text-anchor="middle" font-size="13">第 5 步仍停下</text>
    <text x="839" y="176" text-anchor="middle" font-size="13" fill="#6f675e">不改这条</text>
  </svg>

</html>
