<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMP 默认字体用 Noto（需求稿）</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .zone { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
  .zone.in { border-color: #c9d6a8; }
  .zone.out { border-color: #e8c4b4; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--in-soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .zone.out .chip { background: var(--out-soft); text-decoration: line-through; text-decoration-color: #c2410c; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>TMP 默认字体用 Noto（需求稿）</h1>
  <p class="sub">默认字体 + Start 已有文本都挂 Noto</p>

  <section class="band">
    <h2>结构</h2>
    <svg class="diag" viewBox="0 0 980 230" role="img" aria-label="Settings 默认和 Start Prefab 都改挂 Noto">
      <rect x="24" y="70" width="200" height="90" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="124" y="106" text-anchor="middle" font-size="14" font-weight="650">TMP Settings</text>
      <text x="124" y="128" text-anchor="middle" font-size="12" fill="#6f675e">默认 = Noto SDF</text>
      <path d="M224 115 H280" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="280" y="30" width="240" height="80" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="400" y="62" text-anchor="middle" font-size="13" font-weight="650">GameRes/UI/Start Prefab</text>
      <text x="400" y="84" text-anchor="middle" font-size="12" fill="#6f675e">Home / Loop / Collect / Tab</text>
      <rect x="280" y="126" width="240" height="80" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="400" y="158" text-anchor="middle" font-size="13" font-weight="650">Excluded 同名场景</text>
      <text x="400" y="180" text-anchor="middle" font-size="12" fill="#6f675e">字体 + Atlas Material</text>
      <rect x="560" y="70" width="190" height="90" rx="12" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="655" y="106" text-anchor="middle" font-size="13" font-weight="650">不再出现</text>
      <text x="655" y="128" text-anchor="middle" font-size="12" fill="#6f675e">LiberationSans guid</text>
      <rect x="780" y="70" width="176" height="90" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="868" y="106" text-anchor="middle" font-size="13" font-weight="650">两处 Fallback</text>
      <text x="868" y="128" text-anchor="middle" font-size="12" fill="#6f675e">仍留着这份 Noto</text>
    </svg>
  </section>

  <section class="band">
    <h2>纳入 · 排除</h2>
    <div class="grid">
      <div class="zone in">
        <div class="chips">
          <span class="chip">动态图集参数不改</span>
          <span class="chip">m_fontAsset + m_sharedMaterial 一起改</span>
        </div>
      </div>
      <div class="zone out">
        <div class="chips">
          <span class="chip">只改 Settings 不改 Prefab</span>
          <span class="chip">拿掉 LiberationSans / Noto Fallback</span>
          <span class="chip">改 LoopList SetActive</span>
          <span class="chip">改 Builder / WndHome.cs</span>
          <span class="chip">再拷像素字 / 改静态图集</span>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
