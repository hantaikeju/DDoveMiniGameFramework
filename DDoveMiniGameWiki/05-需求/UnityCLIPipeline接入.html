<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unity CLI Pipeline 接入（需求稿）</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .zone { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
  .zone.in { border-color: #c9d6a8; }
  .zone.out { border-color: #e8c4b4; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--in-soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .zone.out .chip { background: var(--out-soft); text-decoration: line-through; text-decoration-color: #c2410c; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Unity CLI Pipeline 接入（需求稿）</h1>
  <p class="sub">嵌入包 · 本机 CLI · Cursor 硬边界</p>

  <section class="band">
    <h2>结构</h2>
    <svg class="diag" viewBox="0 0 980 240" role="img" aria-label="桌面包拷进 Packages，CLI 连编辑器，Cursor 走技能">
      <rect x="20" y="50" width="200" height="140" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="120" y="96" text-anchor="middle" font-size="13" font-weight="650">桌面 com.unity.pipeline</text>
      <text x="120" y="120" text-anchor="middle" font-size="12" fill="#6f675e">整夹拷进 Packages</text>
      <text x="120" y="144" text-anchor="middle" font-size="12" fill="#6f675e">unity → 2022.3</text>
      <path d="M220 120 H270" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="270" y="30" width="200" height="80" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="370" y="62" text-anchor="middle" font-size="13" font-weight="650">编辑器服务</text>
      <text x="370" y="84" text-anchor="middle" font-size="12" fill="#6f675e">127.0.0.1 : 7800–7849</text>
      <rect x="270" y="130" width="200" height="80" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="370" y="162" text-anchor="middle" font-size="13" font-weight="650">魔改 CLI</text>
      <text x="370" y="184" text-anchor="middle" font-size="12" fill="#6f675e">1.0.0-beta.2 · editor_status</text>
      <rect x="510" y="50" width="220" height="140" rx="12" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="620" y="96" text-anchor="middle" font-size="13" font-weight="650">Cursor</text>
      <text x="620" y="120" text-anchor="middle" font-size="12" fill="#6f675e">unity-pipeline-boundary</text>
      <text x="620" y="144" text-anchor="middle" font-size="12" fill="#6f675e">ddove-unity-pipeline</text>
      <rect x="760" y="50" width="200" height="140" rx="12" fill="#f8ebe3" stroke="#e8c4b4"/>
      <text x="860" y="96" text-anchor="middle" font-size="13" font-weight="650" fill="#9a3412">不改 manifest</text>
      <text x="860" y="120" text-anchor="middle" font-size="12" fill="#6f675e">不挂 DDove/Editor</text>
      <text x="860" y="144" text-anchor="middle" font-size="12" fill="#6f675e">不拷桌面官方技能</text>
    </svg>
  </section>

  <section class="band">
    <h2>纳入 · 排除</h2>
    <div class="grid">
      <div class="zone in">
        <div class="chips">
          <span class="chip">场景 / Prefab / 材质 / SO / 动画 / 工程设置走 Pipeline</span>
          <span class="chip">.cs 直接改 · set_autotick / recompile</span>
          <span class="chip">CLI 连不上仍可改纯文本并写明</span>
          <span class="chip">AGENTS.md 加指针</span>
        </div>
      </div>
      <div class="zone out">
        <div class="chips">
          <span class="chip">package.json 留 6000.0</span>
          <span class="chip">改成 file: 依赖</span>
          <span class="chip">官方 Unity 6 install.ps1</span>
          <span class="chip">给其它 agent 另写规则</span>
          <span class="chip">热重载当日常必经</span>
          <span class="chip">自行改低 newtonsoft / cecil</span>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
