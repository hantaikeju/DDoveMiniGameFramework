<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开工后选下一步（需求稿）</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .zone { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
  .zone.in { border-color: #c9d6a8; }
  .zone.out { border-color: #e8c4b4; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--in-soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .zone.out .chip { background: var(--out-soft); text-decoration: line-through; text-decoration-color: #c2410c; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>开工后选下一步（需求稿）</h1>
  <p class="sub">收口链 · 开工结束只二选一</p>

  <section class="band">
    <h2>纳入的收口</h2>
    <svg class="diag" viewBox="0 0 980 240" role="img" aria-label="grill 到 create 到 work 后二选一，fix-up 回到 work，change-state 收尾">
      <rect x="20" y="88" width="130" height="56" rx="10" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="85" y="122" text-anchor="middle" font-size="13" font-weight="650">/ddove-grill</text>
      <path d="M150 116 H190" stroke="#b8ae9f" stroke-width="2"/>
      <polygon points="190,112 200,116 190,120" fill="#b8ae9f"/>
      <rect x="200" y="88" width="150" height="56" rx="10" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="275" y="122" text-anchor="middle" font-size="13" font-weight="650">/ddove-wiki-create</text>
      <path d="M350 116 H390" stroke="#b8ae9f" stroke-width="2"/>
      <polygon points="390,112 400,116 390,120" fill="#b8ae9f"/>
      <rect x="400" y="88" width="130" height="56" rx="10" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="465" y="122" text-anchor="middle" font-size="13" font-weight="650">/ddove-work</text>
      <path d="M530 116 H570" stroke="#b8ae9f" stroke-width="2"/>
      <polygon points="570,112 580,116 570,120" fill="#b8ae9f"/>
      <rect x="580" y="20" width="170" height="56" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="665" y="42" text-anchor="middle" font-size="13" font-weight="650" fill="#3f6212">/ddove-fix-up</text>
      <text x="665" y="60" text-anchor="middle" font-size="11" fill="#6f675e">只收要修 · 下一步 work</text>
      <rect x="580" y="156" width="200" height="56" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="680" y="178" text-anchor="middle" font-size="13" font-weight="650" fill="#3f6212">/ddove-wiki-change-state</text>
      <text x="680" y="196" text-anchor="middle" font-size="11" fill="#6f675e">最后一步 · 不再报下一刀</text>
      <path d="M530 100 C550 100 560 48 580 48" stroke="#b8ae9f" stroke-width="2" fill="none"/>
      <path d="M530 132 C550 132 560 184 580 184" stroke="#b8ae9f" stroke-width="2" fill="none"/>
      <path d="M750 48 H800 V116 H530" stroke="#b8ae9f" stroke-width="2" fill="none"/>
      <polygon points="530,112 540,116 530,120" fill="#b8ae9f"/>
      <rect x="810" y="88" width="150" height="56" rx="10" fill="#f8ebe3" stroke="#e8c4b4"/>
      <text x="885" y="122" text-anchor="middle" font-size="13" font-weight="650" fill="#9a3412">/ddove-next</text>
    </svg>
  </section>

  <section class="band">
    <h2>纳入 · 排除</h2>
    <div class="grid">
      <div class="zone in">
        <div class="chips">
          <span class="chip">grill 对齐后只报 create</span>
          <span class="chip">create 落 05-需求 后只报 work</span>
          <span class="chip">开工结束二选一</span>
          <span class="chip">问答 / 排障不弹题</span>
          <span class="chip">fix-up 两份 skill · 不改代码</span>
          <span class="chip">help / 工作流 / 总览 / 开工班组 / AGENTS</span>
        </div>
      </div>
      <div class="zone out">
        <div class="chips">
          <span class="chip">代理判断做完没做完</span>
          <span class="chip">grill 内部执行 create</span>
          <span class="chip">保留 next 多一跳</span>
          <span class="chip">fix-up 改代码 / 篇 / status</span>
          <span class="chip">第三选项</span>
          <span class="chip">改 wiki-update 下一刀</span>
          <span class="chip">自动升 stable</span>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
