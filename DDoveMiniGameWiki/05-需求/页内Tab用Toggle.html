<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页内 Tab 用 Toggle（需求稿）</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .zone { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
  .zone.in { border-color: #c9d6a8; }
  .zone.out { border-color: #e8c4b4; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--in-soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .zone.out .chip { background: var(--out-soft); text-decoration: line-through; text-decoration-color: #c2410c; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>页内 Tab 用 Toggle（需求稿）</h1>
  <p class="sub">WndTabDemo · ToggleGroup 里始终一个 1</p>

  <section class="band">
    <h2>结构</h2>
    <svg class="diag" viewBox="0 0 980 230" role="img" aria-label="两个 Toggle 同一组，点另一个才 OpenChild">
      <rect x="24" y="30" width="280" height="170" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="164" y="58" text-anchor="middle" font-size="14" font-weight="650">ToggleGroup</text>
      <text x="164" y="78" text-anchor="middle" font-size="12" fill="#6f675e">allowSwitchOff 关</text>
      <rect x="44" y="96" width="110" height="80" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="99" y="128" text-anchor="middle" font-size="13" font-weight="650">BtnTabA</text>
      <text x="99" y="150" text-anchor="middle" font-size="12" fill="#3f6212">isOn = 1 · 白</text>
      <rect x="174" y="96" width="110" height="80" rx="10" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="229" y="128" text-anchor="middle" font-size="13" font-weight="650">BtnTabB</text>
      <text x="229" y="150" text-anchor="middle" font-size="12" fill="#6f675e">isOn = 0 · 灰 0.55</text>
      <path d="M304 115 H360" stroke="#b8ae9f" stroke-width="2"/>
      <polygon points="360,111 370,115 360,119" fill="#b8ae9f"/>
      <rect x="380" y="50" width="200" height="60" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="480" y="74" text-anchor="middle" font-size="13" font-weight="650">打开父页</text>
      <text x="480" y="94" text-anchor="middle" font-size="12" fill="#6f675e">SetIsOnWithoutNotify · 只开 A</text>
      <rect x="380" y="130" width="200" height="60" rx="10" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="480" y="154" text-anchor="middle" font-size="13" font-weight="650">点另一个</text>
      <text x="480" y="174" text-anchor="middle" font-size="12" fill="#6f675e">换 1/0 · OpenChildAsync</text>
      <rect x="620" y="50" width="160" height="60" rx="10" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="700" y="74" text-anchor="middle" font-size="13" font-weight="650">WndTabPageA</text>
      <text x="700" y="94" text-anchor="middle" font-size="12" fill="#6f675e">已是这页则停</text>
      <rect x="620" y="130" width="160" height="60" rx="10" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="700" y="154" text-anchor="middle" font-size="13" font-weight="650">返回 Button</text>
      <text x="700" y="174" text-anchor="middle" font-size="12" fill="#6f675e">BackAsync · 原变色</text>
      <rect x="800" y="80" width="160" height="70" rx="10" fill="#f8ebe3" stroke="#e8c4b4"/>
      <text x="880" y="110" text-anchor="middle" font-size="13" font-weight="650" fill="#9a3412">再点已是 1</text>
      <text x="880" y="130" text-anchor="middle" font-size="12" fill="#6f675e">不二次打开</text>
    </svg>
  </section>

  <section class="band">
    <h2>纳入 · 排除</h2>
    <div class="grid">
      <div class="zone in">
        <div class="chips">
          <span class="chip">Toggle + 同一 ToggleGroup</span>
          <span class="chip">过渡 None · 底色对照</span>
          <span class="chip">Excluded_Top 同样底色</span>
          <span class="chip">子页仍 OpenChildAsync</span>
        </div>
      </div>
      <div class="zone out">
        <div class="chips">
          <span class="chip">Tab 继续用 Button</span>
          <span class="chip">两个都是 1 或都是 0</span>
          <span class="chip">勾选标记</span>
          <span class="chip">改 OpenChildAsync / GameLaunch</span>
          <span class="chip">可复用 Tab 组件</span>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
