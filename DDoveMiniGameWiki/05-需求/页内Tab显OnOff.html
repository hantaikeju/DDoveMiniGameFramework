<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页内 Tab 显 On Off（需求稿）</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .zone { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
  .zone.in { border-color: #c9d6a8; }
  .zone.out { border-color: #e8c4b4; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--in-soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .zone.out .chip { background: var(--out-soft); text-decoration: line-through; text-decoration-color: #c2410c; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>页内 Tab 显 On Off（需求稿）</h1>
  <p class="sub">Game.Mono.TabOnOff · 只切两套显隐</p>

  <section class="band">
    <h2>结构</h2>
    <svg class="diag" viewBox="0 0 980 230" role="img" aria-label="Toggle 与 TabOnOff 同物体，isOn 切 On Off">
      <rect x="24" y="36" width="260" height="160" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="154" y="66" text-anchor="middle" font-size="14" font-weight="650">按钮物体</text>
      <text x="154" y="86" text-anchor="middle" font-size="12" fill="#6f675e">Toggle + TabOnOff</text>
      <rect x="44" y="108" width="100" height="64" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="94" y="136" text-anchor="middle" font-size="13" font-weight="650">On</text>
      <text x="94" y="156" text-anchor="middle" font-size="11" fill="#6f675e">图 + 字</text>
      <rect x="164" y="108" width="100" height="64" rx="10" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="214" y="136" text-anchor="middle" font-size="13" font-weight="650">Off</text>
      <text x="214" y="156" text-anchor="middle" font-size="11" fill="#6f675e">图 + 字</text>
      <path d="M284 116 H340" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="350" y="40" width="200" height="70" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="450" y="70" text-anchor="middle" font-size="13" font-weight="650">isOn 真</text>
      <text x="450" y="90" text-anchor="middle" font-size="12" fill="#6f675e">显 On · 藏 Off</text>
      <rect x="350" y="126" width="200" height="70" rx="10" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="450" y="156" text-anchor="middle" font-size="13" font-weight="650">isOn 假</text>
      <text x="450" y="176" text-anchor="middle" font-size="12" fill="#6f675e">显 Off · 藏 On</text>
      <rect x="580" y="40" width="180" height="70" rx="10" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="670" y="70" text-anchor="middle" font-size="13" font-weight="650">Assets/Game/Mono</text>
      <text x="670" y="90" text-anchor="middle" font-size="12" fill="#6f675e">并列 Scroll · 不进 DDoveUI</text>
      <rect x="580" y="126" width="180" height="70" rx="10" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="670" y="156" text-anchor="middle" font-size="13" font-weight="650">WndTabDemo</text>
      <text x="670" y="176" text-anchor="middle" font-size="12" fill="#6f675e">挂上 · 不再写 Image.color</text>
      <rect x="790" y="70" width="170" height="90" rx="10" fill="#f8ebe3" stroke="#e8c4b4"/>
      <text x="875" y="106" text-anchor="middle" font-size="13" font-weight="650" fill="#9a3412">不改颜色</text>
      <text x="875" y="128" text-anchor="middle" font-size="12" fill="#6f675e">不换 Sprite</text>
    </svg>
  </section>

  <section class="band">
    <h2>纳入 · 排除</h2>
    <div class="grid">
      <div class="zone in">
        <div class="chips">
          <span class="chip">On 白底深字 · Off 灰底白字</span>
          <span class="chip">启用 / 静默改 isOn 后 Refresh</span>
          <span class="chip">Excluded_Top 同样摆两套</span>
          <span class="chip">返回仍 Button · BackAsync</span>
        </div>
      </div>
      <div class="zone out">
        <div class="chips">
          <span class="chip">ApplyTabColor</span>
          <span class="chip">Toggle 变色 / Sprite Swap</span>
          <span class="chip">Mono 放进 DDoveUI</span>
          <span class="chip">另做 Sprite 文件</span>
          <span class="chip">On Off 同时显或同时藏</span>
          <span class="chip">再点已真再次 OpenChild</span>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
