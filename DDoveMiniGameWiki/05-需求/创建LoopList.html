<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创建 LoopList（需求稿）</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .zone { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
  .zone.in { border-color: #c9d6a8; }
  .zone.out { border-color: #e8c4b4; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--in-soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .zone.out .chip { background: var(--out-soft); text-decoration: line-through; text-decoration-color: #c2410c; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>创建 LoopList（需求稿）</h1>
  <p class="sub">HotBox · UI 制作 · Game.Editor 小窗</p>

  <section class="band">
    <h2>结构</h2>
    <svg class="diag" viewBox="0 0 980 240" role="img" aria-label="选父节点后挂空树">
      <rect x="24" y="40" width="200" height="160" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="124" y="78" text-anchor="middle" font-size="14" font-weight="650">创建 LoopList</text>
      <text x="124" y="102" text-anchor="middle" font-size="12" fill="#6f675e">竖 / 100 / 8 / padding 8</text>
      <text x="124" y="124" text-anchor="middle" font-size="12" fill="#6f675e">previewCount 不进窗</text>
      <text x="124" y="160" text-anchor="middle" font-size="12" fill="#6f675e">一个 padding 写四边</text>
      <path d="M224 120 H280" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="280" y="20" width="200" height="56" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="380" y="54" text-anchor="middle" font-size="12">无选中 → UIRoot</text>
      <rect x="280" y="88" width="200" height="56" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="380" y="122" text-anchor="middle" font-size="12">一个 RectTransform → 其下</text>
      <rect x="280" y="156" width="200" height="56" rx="10" fill="#f8ebe3" stroke="#e8c4b4"/>
      <text x="380" y="190" text-anchor="middle" font-size="12" fill="#9a3412">多选 / 无 Rect → 停</text>
      <rect x="520" y="40" width="220" height="160" rx="12" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="630" y="78" text-anchor="middle" font-size="14" font-weight="650">造出的树</text>
      <text x="630" y="106" text-anchor="middle" font-size="12">ScrollRect</text>
      <text x="630" y="128" text-anchor="middle" font-size="12">Viewport</text>
      <text x="630" y="150" text-anchor="middle" font-size="12">Content</text>
      <text x="630" y="172" text-anchor="middle" font-size="12">失活空 itemTemplate</text>
      <rect x="770" y="70" width="186" height="100" rx="12" fill="#f8ebe3" stroke="#e8c4b4"/>
      <text x="863" y="110" text-anchor="middle" font-size="13" font-weight="650" fill="#9a3412">不改运行时</text>
      <text x="863" y="132" text-anchor="middle" font-size="12" fill="#6f675e">不改两条 Build 菜单</text>
    </svg>
  </section>

  <section class="band">
    <h2>纳入 · 排除</h2>
    <div class="grid">
      <div class="zone in">
        <div class="chips">
          <span class="chip">重名 LoopList (1)</span>
          <span class="chip">竖关水平 · 横关垂直</span>
          <span class="chip">Content 顶对齐 / 左对齐</span>
          <span class="chip">铺满父节点</span>
        </div>
      </div>
      <div class="zone out">
        <div class="chips">
          <span class="chip">放进 DDoveUI / 引用 Game</span>
          <span class="chip">NodeBind · DemoRow · tween</span>
          <span class="chip">改 LoopList 签名</span>
          <span class="chip">padding 拆四边 · 人选 previewCount</span>
          <span class="chip">LayoutGroup / ContentSizeFitter</span>
          <span class="chip">多选挂到第一个</span>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
