<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创建 LoopList 标题栏（需求稿）</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .zone { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
  .zone.in { border-color: #c9d6a8; }
  .zone.out { border-color: #e8c4b4; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--in-soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .zone.out .chip { background: var(--out-soft); text-decoration: line-through; text-decoration-color: #c2410c; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>创建 LoopList 标题栏（需求稿）</h1>
  <p class="sub">普通编辑器窗 · 深色栏 · 只留一扇</p>

  <section class="band">
    <h2>结构</h2>
    <svg class="diag" viewBox="0 0 980 210" role="img" aria-label="GetWindow 一扇，创建 UI 场景仍系统小窗">
      <rect x="30" y="50" width="220" height="110" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="140" y="94" text-anchor="middle" font-size="14" font-weight="650">HotBox 再开</text>
      <text x="140" y="118" text-anchor="middle" font-size="12" fill="#6f675e">已有则聚焦</text>
      <path d="M250 105 H310" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="310" y="40" width="240" height="130" rx="12" fill="#1e3a5f"/>
      <rect x="310" y="40" width="240" height="28" rx="12" fill="#152a45"/>
      <text x="430" y="60" text-anchor="middle" font-size="12" fill="#f3efe6">创建 LoopList</text>
      <text x="430" y="108" text-anchor="middle" font-size="13" fill="#f3efe6">420 × 268 居中</text>
      <text x="430" y="132" text-anchor="middle" font-size="12" fill="#c9d6e6">字段与创建逻辑不动</text>
      <rect x="590" y="50" width="170" height="110" rx="12" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="675" y="94" text-anchor="middle" font-size="13" font-weight="650">仍挂 UIRoot</text>
      <text x="675" y="118" text-anchor="middle" font-size="12" fill="#6f675e">窗内字段不动</text>
      <rect x="790" y="50" width="160" height="110" rx="12" fill="#f8ebe3" stroke="#e8c4b4"/>
      <text x="870" y="94" text-anchor="middle" font-size="13" font-weight="650" fill="#9a3412">创建 UI 场景</text>
      <text x="870" y="118" text-anchor="middle" font-size="12" fill="#6f675e">仍系统小窗</text>
    </svg>
  </section>

  <section class="band">
    <h2>纳入 · 排除</h2>
    <div class="grid">
      <div class="zone in">
        <div class="chips">
          <span class="chip">与 DDove/Editor 同类深色栏</span>
          <span class="chip">打开方式与总窗一样</span>
        </div>
      </div>
      <div class="zone out">
        <div class="chips">
          <span class="chip">系统小窗白底红叉</span>
          <span class="chip">每次另开第二扇</span>
          <span class="chip">改字段 / 默认值 / 父节点规则</span>
          <span class="chip">改 DDove 总窗本身</span>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
