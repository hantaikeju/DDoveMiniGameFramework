<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>创建 LoopList 标题栏（需求稿）</title>
<style>
  body { margin: 0; font: 16px/1.55 "Segoe UI", sans-serif; color: #1c1c1c; background: #f6f4ef; }
  main { max-width: 960px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 28px; margin: 0 0 20px; }
  .cols { display: flex; gap: 16px; align-items: flex-start; }
  section { flex: 1; background: #fff; border: 1px solid #e2ddd4; border-radius: 10px; padding: 16px 18px 8px; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  p { margin: 0 0 12px; }
  ul { margin: 0 0 12px; padding-left: 1.2em; }
  code { font-family: Consolas, monospace; font-size: 0.92em; background: #f3efe6; padding: 0 4px; border-radius: 3px; }
  @media (max-width: 720px) {
    .cols { flex-direction: column; }
  }
</style>
</head>
<body>
<main>
  <h1>创建 LoopList 标题栏（需求稿）</h1>
  <div class="cols">
    <section>
      <h2>要什么</h2>
      <p>「创建 LoopList」改成普通编辑器窗口，标题栏与 <code>DDove/Editor</code> 同一类深色栏。打开方式与总窗一样：已有一扇就聚焦它，不另开第二扇。</p>
      <p>尺寸仍锁在 <code>420×268</code>，打开时居中。窗里的方向、条尺寸、间距、边距和「创建」不动。列表仍挂在 <code>UIRoot</code> 下。</p>
      <p>「创建 UI 场景」保持现在的系统小窗。</p>
    </section>
    <section>
      <h2>不要</h2>
      <ul>
        <li>继续用系统小窗（白底红叉）打开「创建 LoopList」</li>
        <li>每次从 HotBox 再开一扇</li>
        <li>改窗内字段、默认值、创建逻辑或父节点规则</li>
        <li>改「创建 UI 场景」</li>
        <li>改 DDove 总窗本身</li>
      </ul>
    </section>
  </div>
</main>
</body>
</html>
