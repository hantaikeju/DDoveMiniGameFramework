<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoopList 点击（需求稿）</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .zone { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
  .zone.in { border-color: #c9d6a8; }
  .zone.out { border-color: #e8c4b4; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--in-soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .zone.out .chip { background: var(--out-soft); text-decoration: line-through; text-decoration-color: #c2410c; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>LoopList 点击（需求稿）</h1>
  <p class="sub">AddClick · 点击当时读下标</p>

  <section class="band">
    <h2>结构</h2>
    <svg class="diag" viewBox="0 0 980 230" role="img" aria-label="格子 Button 点到外部，声音走 ClickSound">
      <rect x="24" y="50" width="220" height="130" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="134" y="96" text-anchor="middle" font-size="14" font-weight="650">LoopList.AddClick</text>
      <text x="134" y="120" text-anchor="middle" font-size="12" fill="#6f675e">Action&lt;int&gt; · soundName</text>
      <text x="134" y="144" text-anchor="middle" font-size="12" fill="#6f675e">再调一次替掉不叠加</text>
      <path d="M244 115 H300" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="300" y="30" width="200" height="70" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="400" y="60" text-anchor="middle" font-size="13" font-weight="650">根上 Button</text>
      <text x="400" y="80" text-anchor="middle" font-size="12" fill="#6f675e">点时读 Bind 下标</text>
      <rect x="300" y="120" width="200" height="70" rx="10" fill="#f8ebe3" stroke="#e8c4b4"/>
      <text x="400" y="150" text-anchor="middle" font-size="13" font-weight="650" fill="#9a3412">无根 Button</text>
      <text x="400" y="170" text-anchor="middle" font-size="12" fill="#6f675e">不挂这次点击</text>
      <rect x="540" y="30" width="200" height="70" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="640" y="60" text-anchor="middle" font-size="13" font-weight="650">soundName 非空</text>
      <text x="640" y="80" text-anchor="middle" font-size="12" fill="#6f675e">一份 ClickSound</text>
      <rect x="540" y="120" width="200" height="70" rx="10" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="640" y="150" text-anchor="middle" font-size="13" font-weight="650">soundName 空</text>
      <text x="640" y="170" text-anchor="middle" font-size="12" fill="#6f675e">不加也不改已有</text>
      <rect x="770" y="70" width="186" height="90" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="863" y="106" text-anchor="middle" font-size="13" font-weight="650">DemoRow</text>
      <text x="863" y="128" text-anchor="middle" font-size="12" fill="#6f675e">Awake 不再挂 onClick</text>
    </svg>
  </section>

  <section class="band">
    <h2>纳入 · 排除</h2>
    <div class="grid">
      <div class="zone in">
        <div class="chips">
          <span class="chip">播放仍走 ClickSound.PlaySound</span>
          <span class="chip">竖样板 AddClick 打行日志</span>
          <span class="chip">横竖共用一套</span>
        </div>
      </div>
      <div class="zone out">
        <div class="chips">
          <span class="chip">abstract LoopListItem</span>
          <span class="chip">LoopList 直接 PlaySound</span>
          <span class="chip">改面板 AddClick</span>
          <span class="chip">每次 Bind 再 AddListener</span>
          <span class="chip">造格子时抓住旧下标</span>
          <span class="chip">空名还加 ClickSound / 挂两份</span>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
