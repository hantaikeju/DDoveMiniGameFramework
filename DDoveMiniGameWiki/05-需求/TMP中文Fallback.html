<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMP 中文 Fallback（需求稿）</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1915; --muted:#6f675e; --rule:#e3dcd0; --in:#3f6212; --in-soft:#f1f6e8; --out:#9a3412; --out-soft:#f8ebe3; --node:#1e3a5f; --node-soft:#e8eef5; --line:#b8ae9f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .band { margin: 0 0 20px; }
  .band h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .zone { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
  .zone.in { border-color: #c9d6a8; }
  .zone.out { border-color: #e8c4b4; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--in-soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .zone.out .chip { background: var(--out-soft); text-decoration: line-through; text-decoration-color: #c2410c; }
  svg.diag { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>TMP 中文 Fallback（需求稿）</h1>
  <p class="sub">Noto 追加进两处 Fallback · 默认仍 LiberationSans</p>

  <section class="band">
    <h2>结构</h2>
    <svg class="diag" viewBox="0 0 980 230" role="img" aria-label="MeowPantry 拷入后挂到两处 Fallback">
      <rect x="24" y="50" width="220" height="130" rx="12" fill="#e8eef5" stroke="#c9d6e6"/>
      <text x="134" y="96" text-anchor="middle" font-size="13" font-weight="650">MeowPantry Fonts</text>
      <text x="134" y="120" text-anchor="middle" font-size="12" fill="#6f675e">otf + SDF + 两份 meta</text>
      <text x="134" y="144" text-anchor="middle" font-size="12" fill="#6f675e">guid 保持</text>
      <path d="M244 115 H300" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="300" y="50" width="240" height="130" rx="12" fill="#fffcf7" stroke="#e3dcd0"/>
      <text x="420" y="90" text-anchor="middle" font-size="13" font-weight="650">TMP Resources</text>
      <text x="420" y="114" text-anchor="middle" font-size="12" fill="#6f675e">动态 90 / 9 / 1024</text>
      <text x="420" y="136" text-anchor="middle" font-size="12" fill="#6f675e">多图集 · Build 清字形</text>
      <path d="M540 90 H590" stroke="#b8ae9f" stroke-width="2"/>
      <path d="M540 140 H590" stroke="#b8ae9f" stroke-width="2"/>
      <rect x="590" y="30" width="180" height="70" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="680" y="60" text-anchor="middle" font-size="12" font-weight="650">LiberationSans Fallback</text>
      <text x="680" y="80" text-anchor="middle" font-size="11" fill="#6f675e">先西文再追加 Noto</text>
      <rect x="590" y="120" width="180" height="70" rx="10" fill="#f1f6e8" stroke="#c9d6a8"/>
      <text x="680" y="150" text-anchor="middle" font-size="12" font-weight="650">TMP Settings Fallback</text>
      <text x="680" y="170" text-anchor="middle" font-size="11" fill="#6f675e">同一份 Noto</text>
      <rect x="790" y="70" width="166" height="90" rx="10" fill="#f8ebe3" stroke="#e8c4b4"/>
      <text x="873" y="106" text-anchor="middle" font-size="12" font-weight="650" fill="#9a3412">默认仍 LiberationSans</text>
      <text x="873" y="128" text-anchor="middle" font-size="11" fill="#6f675e">已有文本不改引用</text>
    </svg>
  </section>

  <section class="band">
    <h2>纳入 · 排除</h2>
    <div class="grid">
      <div class="zone in">
        <div class="chips">
          <span class="chip">WndHome「领取/换图」靠 Fallback</span>
          <span class="chip">Resources 引用带进包</span>
          <span class="chip">不另做收集项</span>
        </div>
      </div>
      <div class="zone out">
        <div class="chips">
          <span class="chip">默认字体改成 Noto</span>
          <span class="chip">逐个改 Prefab 字体</span>
          <span class="chip">拷 fusion-pixel</span>
          <span class="chip">放进 GameRes / BundleCollector</span>
          <span class="chip">静态图集 · 关多图集</span>
          <span class="chip">运行时 DDoveRes / Yoo 按名 Load</span>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
