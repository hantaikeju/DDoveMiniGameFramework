name: wiki-check

on:
  pull_request:
    paths:
      - "DDoveMiniGameWiki/**"
      - "DDoveMiniGameTools/**"
      - ".github/workflows/wiki-check.yml"
  push:
    paths:
      - "DDoveMiniGameWiki/**"
      - "DDoveMiniGameTools/**"
      - ".github/workflows/wiki-check.yml"

jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require type and status on concepts
        run: python DDoveMiniGameTools/check_wiki.py
